/api/profiles:
  get:
    summary: Buscar perfiles de empresas
    tags: [Profiles]
    parameters:
      - name: search
        in: query
        schema: { type: string }
      - name: regionId
        in: query
        schema: { type: string }
      - name: categoryId
        in: query
        schema: { type: string }
      - name: verified
        in: query
        schema: { type: boolean }
      - name: employeesMin
        in: query
        schema: { type: integer, minimum: 0 }
      - name: employeesMax
        in: query
        schema: { type: integer, minimum: 0 }
      - name: sort
        in: query
        schema: { type: string, enum: [relevance, newest, oldest], default: newest }
    responses:
      '200':
        description: Perfiles encontrados
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ProfilesResponse'

/api/profiles/{userId}:
  get:
    summary: Obtener perfil por ID de usuario
    description: Devuelve el perfil de empresa asociado al userId.
    tags: [Profiles]
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Perfil encontrado
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ProfileResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'

/api/profiles/me:
  patch:
    summary: Actualizar perfil propio
    description: Actualiza o crea el perfil del usuario autenticado.
    tags: [Profiles]
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ProfileUpdateInput'
    responses:
      '200':
        description: Perfil actualizado
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ProfileResponse'
      '400':
        $ref: '../openapi.yaml#/components/responses/InputParseError'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
